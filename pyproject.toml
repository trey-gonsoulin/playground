[project]
name = "playground"
version = "0.1.0"
description = "Personal MCP servers deployed to AWS Lambda"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

# Dev tools shared by every package (ruff settings are in [tool.ruff] below).
[dependency-groups]
dev = ["ruff>=0.15"]

[tool.uv.workspace]
members = ["packages/*"]

# Shared ruff settings for the repo root and every package.
[tool.ruff]
target-version = "py313"
# Markdown is prose with hand-aligned code samples (CLAUDE.md, READMEs).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PTH", "PLW", "S", "RUF", "ERA", "EXE"]
# `ruff format` owns line length; the remaining long lines are strings and comments.
ignore = ["E501"]
# En dashes in ranges ("1836–1922", "4–50 s") are intended.
allowed-confusables = ["–", "×"]

[tool.ruff.lint.per-file-ignores]
# Tests assert and use dummy hosts and secrets.
"packages/*/tests/**" = ["S101", "S104", "S105", "S106"]
# host="0.0.0.0" is intentional: the local uvicorn server must accept non-localhost
# Host headers (see CLAUDE.md; mcp_lambda carries its own noqa for the MCP guard).
"packages/*/*/main.py" = ["S104"]
