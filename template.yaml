AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Personal MCP servers deployed to AWS Lambda

Globals:
  Function:
    Timeout: 30
    MemorySize: 512

Resources:
  YnabMcpFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Environment:
        Variables:
          YNAB_API_KEY: "{{resolve:ssm:/ynab/api-key}}"
          YNAB_MCP_SECRET: "{{resolve:ssm:/ynab/mcp-secret}}"
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref YnabHttpApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref YnabHttpApi
            Path: /{proxy+}
            Method: ANY
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: packages/ynab-mcp/Dockerfile

  YnabHttpApi:
    Type: AWS::Serverless::HttpApi

  # ---------------------------------------------------------------------------
  # Genealogy — personal family tree (JSON/GEDCOM in S3) + WikiTree + newspapers
  # ---------------------------------------------------------------------------

  # Holds trees/<name>/{tree.json,tree.ged,exports/,resources/}. Retained and
  # versioned: family research is irreplaceable, and versioning is the undo for
  # tree_remove_person / tree_import_gedcom replace=True.
  GenealogyBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  GenealogyHttpApi:
    Type: AWS::Serverless::HttpApi

  # No auth for now (like the Elden Ring function): claude.ai
  # connectors can't send a static bearer header. The app enforces one if
  # GENEALOGY_MCP_SECRET is set.
  GenealogyMcpFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      # HTTP API stops waiting at 30 s, so a longer Lambda timeout would only let
      # work finish after the client already saw a 503 (and retried). Keep the
      # function just under it; outbound HTTP calls use 20 s timeouts to fit.
      Timeout: 29
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref GenealogyBucket
      Environment:
        Variables:
          TREE_BUCKET: !Ref GenealogyBucket
          # Identifies this app to WikiTree; anonymous callers get stricter limits.
          WIKITREE_APP_ID: genealogy-mcp
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref GenealogyHttpApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref GenealogyHttpApi
            Path: /{proxy+}
            Method: ANY
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: packages/genealogy/Dockerfile

Outputs:
  YnabMcpApiUrl:
    Description: YNAB MCP HTTP API endpoint URL (MCP server at /mcp)
    Value: !Sub "https://${YnabHttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  GenealogyMcpApiUrl:
    Description: Genealogy MCP HTTP API endpoint URL (MCP server at /mcp)
    Value: !Sub "https://${GenealogyHttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  GenealogyBucketName:
    Description: S3 bucket holding family trees (tree.json, tree.ged, resources/)
    Value: !Ref GenealogyBucket
