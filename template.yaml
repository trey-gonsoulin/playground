AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Therapist Finder — MCP server for searching therapist directories

Globals:
  Function:
    Timeout: 30
    MemorySize: 512

Resources:
  TherapistFinderFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Events:
        Root:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: packages/therapist-finder/Dockerfile

Outputs:
  ApiUrl:
    Description: HTTP API endpoint URL (MCP server at /mcp)
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
