[project]
name = "markets"
version = "0.1.0"
description = "MCP server for short-horizon market analysis"
requires-python = ">=3.13"
dependencies = [
    "yfinance==1.7.0",
    "pandas>=2.2",
    "numpy>=2.1",
    "scipy>=1.14",
    "arch>=7.2",
    "fastapi>=0.115",
    "mangum>=0.21.0",
    "mcp>=2.3,<3",
    "mcp-lambda",
]

[project.scripts]
markets-mcp = "markets.main:cli"

[tool.uv.sources]
mcp-lambda = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["markets"]

[dependency-groups]
dev = [
    # Local dev server only (main.py); kept out of the Lambda image.
    "uvicorn[standard]>=0.30",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
