[project]
name = "ynab-mcp"
version = "0.1.0"
description = "MCP server for YNAB (You Need A Budget)"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mangum>=0.21.0",
    "mcp>=1.0",
]

[project.scripts]
ynab-mcp = "ynab_mcp.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ynab_mcp"]
