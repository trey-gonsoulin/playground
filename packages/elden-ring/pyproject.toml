[project]
name = "elden-ring"
version = "0.1.0"
description = "MCP server for Elden Ring build optimization and lore queries"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "mangum>=0.21.0",
    "mcp>=1.28,<2",
    "opensearch-py>=3.0",
    "boto3>=1.35",
    "botocore>=1.35",
]

[project.scripts]
elden-ring = "elden_ring.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elden_ring"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Local `main.py` only; Lambda runs through Mangum (mcp pulls in plain uvicorn).
    "uvicorn[standard]>=0.30",
]
# Quality gates (#457), only installed by scripts/check.sh (`--group lint`). Kept out of
# the default `dev` group so the plain offline pytest run never needs these wheels.
lint = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0",
    "pyright>=1.1.400",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The loader scripts import each other and tests import them directly (#462).
pythonpath = ["scripts"]
# Live OpenSearch tests are opt-in (#445): pass `-m live` and set ER_LIVE_TESTS=1.
addopts = "-m 'not live'"
markers = [
    "live: needs the deployed stack (EC2 + OpenSearch); deselected by default",
]

[tool.ruff]
target-version = "py313"
# Script modules import each other (pytest pythonpath, #462), so isort treats them as first-party.
src = [".", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PTH", "PLW", "S", "RUF", "ERA", "EXE"]
# `ruff format` owns line length; the remaining long lines are strings and comments.
ignore = ["E501"]
# En dashes in version ranges and the multiplication sign in formulas are intended.
allowed-confusables = ["–", "×"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use dummy hosts and passwords, and quote JP game text (fullwidth punctuation).
"tests/**" = ["S101", "S104", "S105", "RUF001"]

[tool.pyright]
# Tests are mock-heavy and left out; type-check the package and the loader scripts.
include = ["elden_ring", "scripts"]
extraPaths = ["scripts"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
