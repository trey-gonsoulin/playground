[project]
name = "elden-ring"
version = "0.1.0"
description = "MCP server for Elden Ring build optimization and lore queries"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mangum>=0.21.0",
    "mcp>=1.0",
    "opensearch-py>=3.0",
    "boto3>=1.35",
]

[project.scripts]
elden-ring = "elden_ring.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elden_ring"]

[[tool.uv.index]]
url = "https://artifacts.apple.com/api/pypi/pypi-private/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
