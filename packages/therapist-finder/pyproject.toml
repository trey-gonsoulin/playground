[project]
name = "therapist-finder"
version = "0.1.0"
description = "MCP server for searching therapist directories"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mangum>=0.21.0",
    "mcp>=1.0",
    "pydantic>=2.0",
]

[project.scripts]
therapist-finder = "therapist_finder.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["therapist_finder"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.0",
]
