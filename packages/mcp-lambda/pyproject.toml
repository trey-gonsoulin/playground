[project]
name = "mcp-lambda"
version = "0.1.0"
description = "Shared FastAPI + Lambda wiring for the workspace's MCP servers (mcp 2.x)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "mcp>=2.3,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_lambda"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mangum>=0.21.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
