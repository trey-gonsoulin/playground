AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  obsidian-vault: an always-on Lambda MCP front end (stable API Gateway URL) for an
  on-demand Ubuntu 24.04 box running Obsidian (Xvfb + Sync) and vault-mcp. The
  Lambda starts the box when Claude needs it; the box stops itself when idle.

Parameters:
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: >-
      Ubuntu 24.04 AMI, pinned in samconfig.toml. Never point this at the
      "latest" SSM parameter: an ImageId change replaces the instance.
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.small, t4g.medium, t3.small, t3.medium]
    Description: Graviton (t4g) needs an arm64 AMI; t3 needs amd64.
  VolumeSize:
    Type: Number
    Default: 20

Resources:
  # ---------------------------------------------------------------------------
  # Front end: always on, scales to zero
  # ---------------------------------------------------------------------------
  VaultProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures: [arm64]
      MemorySize: 512
      # HTTP APIs cut requests off at 30 s.
      Timeout: 29
      Environment:
        Variables:
          VAULT_INSTANCE_ID: !Ref Instance
      Policies:
        - Statement:
            - Effect: Allow
              Action: ec2:StartInstances
              Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}"
            - Effect: Allow
              Action: ec2:DescribeInstances
              Resource: "*"
            - Effect: Allow
              Action: ssm:GetParameters
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/obsidian-vault/*"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaultHttpApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaultHttpApi
            Path: /{proxy+}
            Method: ANY
    Metadata:
      DockerTag: latest
      DockerContext: ../../..
      Dockerfile: packages/vault-mcp/Dockerfile

  VaultHttpApi:
    Type: AWS::Serverless::HttpApi

  # ---------------------------------------------------------------------------
  # The box
  # ---------------------------------------------------------------------------
  # Deploy artifacts only (deploy.sh push); no backups: Obsidian Sync keeps 30
  # days of history and every device holds a copy.
  DeployBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Obsidian vault server

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: vault-server
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DeployBucket.Arn}/deploy/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DeployBucket.Arn
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/obsidian-vault/*"
              # The box publishes its CA certificate for the Lambda to pin.
              - Effect: Allow
                Action: ssm:PutParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/obsidian-vault/ca-cert"
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # Lambda (no VPC, so no fixed source IPs) reaches vault-mcp on 8443, protected
  # by TLS with the box's own CA and the bearer token, as soulsearch does with
  # OpenSearch. No SSH: shell access is SSM Session Manager.
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: obsidian-vault - vault-mcp HTTPS (bearer token required)
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8443
          ToPort: 8443
          CidrIp: 0.0.0.0/0

  Instance:
    Type: AWS::EC2::Instance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt SecurityGroup.GroupId]
      # vault-idle-stop powers off; that must stop, not terminate.
      InstanceInitiatedShutdownBehavior: stop
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref VolumeSize
            Encrypted: true
            DeleteOnTermination: false
      Tags:
        - Key: Name
          Value: obsidian-vault
      # Just enough for SSM; deploy.sh push runs deploy/server/install.sh.
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux
          mkdir -p /etc/vault-mcp
          cat > /etc/vault-mcp/stack.env <<EOF
          VAULT_BUCKET=${DeployBucket}
          VAULT_TOPIC_ARN=${AlertTopic}
          AWS_REGION=${AWS::Region}
          EOF
          snap install aws-cli --classic || true

  # Only evaluated while running (stopped = no data = OK).
  SystemCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: obsidian-vault host failed its system status check
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions: [{ Name: InstanceId, Value: !Ref Instance }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub "arn:${AWS::Partition}:automate:${AWS::Region}:ec2:recover"
        - !Ref AlertTopic

  # Wedged box: reboot it (the on-box checks can't report that).
  InstanceCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: obsidian-vault failed its instance status check
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_Instance
      Dimensions: [{ Name: InstanceId, Value: !Ref Instance }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 10
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub "arn:${AWS::Partition}:automate:${AWS::Region}:ec2:reboot"
        - !Ref AlertTopic

Outputs:
  McpUrl:
    Description: The custom connector URL
    Value: !Sub "https://${VaultHttpApi}.execute-api.${AWS::Region}.amazonaws.com/mcp"
  InstanceId:
    Value: !Ref Instance
  DeployBucket:
    Value: !Ref DeployBucket
  AlertTopicArn:
    Value: !Ref AlertTopic
