[project]
name = "genealogy"
version = "0.1.0"
description = "MCP server for FamilySearch lookups and building a personal family tree (GEDCOM + S3)"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mangum>=0.21.0",
    "mcp>=1.0",
    "pydantic>=2.0",
    "boto3>=1.35",
]

[project.scripts]
genealogy = "genealogy.main:cli"
genealogy-fs-login = "genealogy.fs_login:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["genealogy"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
