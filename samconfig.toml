# SAM CLI configuration for the mcp-playground stack, committed so deploys are
# reproducible. Every function in template.yaml (ynab, genealogy) deploys into
# this one stack, along with the Elden Ring OpenSearch instance. The Elden Ring
# MCP Lambda deploys from soulsearch's own `soulsearch` stack (soulsearch#2).
#
# Deploy with a reviewed change set (see packages/elden-ring/README.md#deploy):
#   export DOCKER_HOST=unix://$HOME/.docker/run/docker.sock
#   sam build && sam deploy --no-execute-changeset
#   # review the change set, then:
#   aws cloudformation execute-change-set --change-set-name <arn> --profile personal
#
# A new image function needs an ECR repo in image_repositories before a
# non-guided deploy. The genealogy repo was created by hand (aws ecr
# create-repository + the same lifecycle policy as the others) rather than via
# `sam deploy --guided`.
#
# Never run `sam delete`: it targets the stack below, including the OpenSearch
# instance that holds the Elden Ring index.

version = 0.1

# Global, so sam logs / list stack-outputs / remote invoke / sync use it too.
[default.global.parameters]
stack_name = "mcp-playground"
region = "us-east-1"
profile = "personal"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
# A bare `sam deploy` stops at the change set and asks before executing.
confirm_changeset = true
resolve_s3 = true
s3_prefix = "mcp-playground"
image_repositories = ["YnabMcpFunction=268834972001.dkr.ecr.us-east-1.amazonaws.com/mcpplayground7d6ff2e8/ynabmcpfunction7a0a73f1repo", "GenealogyMcpFunction=268834972001.dkr.ecr.us-east-1.amazonaws.com/mcp-playground/genealogymcpfunction"]
