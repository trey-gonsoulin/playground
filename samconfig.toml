# SAM CLI configuration — committed so deploys are reproducible.
# Run `sam deploy --guided` once to populate image_repositories and
# any other values you want to pin, then commit the updated file.

version = 0.1

[default.global.parameters]
stack_name = "therapist-finder"
region = "us-east-1"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
# Set by `sam deploy --guided` after ECR repo is created:
# image_repositories = ["TherapistFinderFunction=<account-id>.dkr.ecr.<region>.amazonaws.com/therapist-finder"]
s3_prefix = "therapist-finder"
profile = "personal"
image_repositories = ["TherapistFinderFunction=268834972001.dkr.ecr.us-east-1.amazonaws.com/therapistfinder8ff77c7a/therapistfinderfunction87be2aadrepo"]
